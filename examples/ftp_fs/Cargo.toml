[package]
name = "ftp_fs"
version = "0.1.0"
edition = "2021"
description = "A read-only FUSE filesystem for FTP servers using easy_fuser"

[features]
logging = ["dep:env_logger"]

[dependencies]
easy_fuser = { path = "../..", features = ["parallel"] }
clap = { version = "^4.6.7", features = ["derive"] }
ctrlc = "^3.5.2"
suppaftp = { version = "^12.1.1", features = ["native-tls"] }
chrono = "^0.4.45"
log = "^0.4.34"
env_logger = { version = "^0.11.11", optional = true }

[dev-dependencies]
tempfile = "^3.27.0"
libunftp = "^0.23.1"
unftp-sbe-fs = "^0.4.0"
async-trait = "^0.1.92"
tokio = { version = "^1.53.1", features = ["full"] }
