[package]
name = "zip_fs"
version = "0.1.2"
edition = "2021"
description = "A read-only FUSE filesystem for ZIP archives using easy_fuser"

[dependencies]
easy_fuser = { path = "../..", features = ["serial"] }
zip = "^8.6.0"
clap = { version = "^4.6.7", features = ["derive"] }
ctrlc = "^3.5.2"

[dev-dependencies]
tempfile = "^3.27.0"
