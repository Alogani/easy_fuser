description = "Procedural macros for the easy_fuser crate"
license = "MIT"
repository = "https://github.com/Alogani/easy_fuser"

[lib]
proc-macro = true

[dependencies]
syn =  {version = "2.0", features = [ "full" ] }
quote = "1.0"
proc-macro2 = "1.0"
either = "1.16"
