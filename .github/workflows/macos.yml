name: CI MacOS

on:
  workflow_dispatch:
  push:
    branches: [main, devel]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, devel]

jobs:
  build_and_test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "macOS FSKit tests"
    runs-on: macos-15

    env:
      PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
      RUST_BACKTRACE: full

    steps:
      - uses: actions/checkout@v4

      - name: System info
        run: |
          sw_vers
          uname -a
          uname -m

      - name: Install macFUSE
        run: |
          brew install --cask macfuse
          brew info --cask macfuse

      - name: Setup Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Prepare FSKit temp directory
        run: |
          sudo mkdir -p /Volumes/easy_fuser_tmp
          sudo chown "$(id -u):$(id -g)" /Volumes/easy_fuser_tmp

          echo "TMPDIR=/Volumes/easy_fuser_tmp" >> "$GITHUB_ENV"

          ls -la /Volumes
          ls -la /Volumes/easy_fuser_tmp

      - name: Enable FSKit backend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/async_test.rs")
          source = path.read_text()

          old = 'mount(fs, &mntpoint_clone, &[], Some(4)).unwrap();'

          new = '''mount(
              fs,
              &mntpoint_clone,
              &[
                  fuser::MountOption::CUSTOM("backend=fskit".into()),
                  fuser::MountOption::CUSTOM("local".into()),
              ],
              Some(4),
          ).unwrap();'''

          if old not in source:
              raise SystemExit("Expected mount call not found")

          path.write_text(source.replace(old, new))
          PY

          git diff -- tests/async_test.rs

      - name: Build library
        run: |
          cargo build \
            --verbose \
            --no-default-features \
            --features "async libfuse"

      - name: Compile async test
        run: |
          cargo test \
            --test async_test \
            --no-run \
            --verbose \
            --no-default-features \
            --features "async libfuse"

      - name: FSKit state before test
        run: |
          echo "=== macFUSE installation ==="
          find /Library/Filesystems -maxdepth 4 -iname '*fuse*' -print 2>/dev/null || true

          echo
          echo "=== FSKit plugins ==="
          pluginkit -m -v | grep -i -A10 -B10 fuse || true

          echo
          echo "=== processes ==="
          ps aux | grep -i fuse || true

          echo
          echo "=== mounts ==="
          mount

          echo
          echo "=== /Volumes ==="
          ls -la /Volumes

      - name: Run async FSKit mount test
        run: |
          cargo test \
            --test async_test \
            test_async_mirror_fs \
            --verbose \
            --no-default-features \
            --features "async libfuse" \
            -- \
            --nocapture \
            --test-threads=1

      - name: macFUSE / FSKit diagnostics
        if: always()
        run: |
          echo "========================================"
          echo "MOUNTS"
          echo "========================================"
          mount || true

          echo
          echo "========================================"
          echo "/VOLUMES"
          echo "========================================"
          ls -la /Volumes || true
          find /Volumes/easy_fuser_tmp -maxdepth 3 -print 2>/dev/null || true

          echo
          echo "========================================"
          echo "MACFUSE PROCESSES"
          echo "========================================"
          ps aux | grep -i fuse || true

          echo
          echo "========================================"
          echo "FSKIT PLUGINS"
          echo "========================================"
          pluginkit -m -v | grep -i -A15 -B15 fuse || true

          echo
          echo "========================================"
          echo "MACFUSE FILES"
          echo "========================================"
          find \
            /Library/Filesystems \
            /Library/SystemExtensions \
            /Applications \
            -maxdepth 6 \
            -iname '*fuse*' \
            -print 2>/dev/null || true

          echo
          echo "========================================"
          echo "SYSTEM LOGS: FSKit / macFUSE"
          echo "========================================"
          sudo log show \
            --last 10m \
            --style compact \
            --info \
            --debug \
            --predicate '
              process == "fskitd"
              OR process CONTAINS[c] "fuse"
              OR subsystem CONTAINS[c] "fuse"
              OR subsystem CONTAINS[c] "FSKit"
              OR eventMessage CONTAINS[c] "macFUSE"
              OR eventMessage CONTAINS[c] "FSKit"
              OR eventMessage CONTAINS[c] "fsmodule"
            ' || true
