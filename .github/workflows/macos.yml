name: macOS FSKit test

on:
  workflow_dispatch:

jobs:
  fskit_test:
    name: "FSKit mount test"
    runs-on: macos-15

    env:
      PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4

      - name: System info
        run: |
          sw_vers
          uname -a
          uname -m

      - name: Install macFUSE
        run: |
          brew install --cask macfuse
          brew info --cask macfuse

      - name: Setup Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      # FSKit only supports mountpoints under /Volumes.
      # tempfile::TempDir will use TMPDIR.
      - name: Prepare FSKit temp directory
        run: |
          sudo mkdir -p /Volumes/easy_fuser_tmp
          sudo chown "$(id -u):$(id -g)" /Volumes/easy_fuser_tmp
          echo "TMPDIR=/Volumes/easy_fuser_tmp" >> "$GITHUB_ENV"

      # Experimental CI-only patch:
      # [] -> backend=fskit for test_async_mirror_fs
      - name: Enable FSKit backend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/async_test.rs")
          source = path.read_text()

          old = 'mount(fs, &mntpoint_clone, &[], Some(4)).unwrap();'
          new = '''
          mount(
              fs,
              &mntpoint_clone,
              &[fuser::MountOption::CUSTOM("backend=fskit".into())],
              Some(4),
          ).unwrap();
          '''.strip()

          if old not in source:
              raise SystemExit("Expected mount call not found")

          path.write_text(source.replace(old, new))
          PY

          git diff -- tests/async_test.rs

      - name: Build async test
        run: |
          cargo test \
            --test async_test \
            --no-run \
            --verbose \
            --no-default-features \
            --features "async libfuse"

      - name: Run async FUSE mount test
        run: |
          cargo test \
            --test async_test \
            test_async_mirror_fs \
            --verbose \
            --no-default-features \
            --features "async libfuse" \
            -- \
            --nocapture

      - name: Mount diagnostics
        if: always()
        run: |
          mount
          ls -la /Volumes || true
          ps aux | grep -i fuse || true
